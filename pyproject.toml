[project]
name = "fresh-and-blood"
version = "0.1.0"
description = "Assistente de decisão para Flesh and Blood (Silver Age) no terminal"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fab = "fresh_and_blood.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
